name: Addon Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      target:
        type: string
        default: both

permissions:
  contents: read

env:
  BUILD_TARGET: ${{ inputs.target || (startsWith(github.base_ref, 'retail/') && 'retail') || (startsWith(github.base_ref, 'forever/') && 'forever') || 'both' }}

concurrency:
  group: addon-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-scope:
    name: Check pull request scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check branch and changed paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import os
          import subprocess

          base, head = os.environ["BASE_REF"], os.environ["HEAD_REF"]
          platforms = {"retail": b"Retail/", "forever": b"Forever/"}
          addon_dirs = (b"TRP3_RPSpellbook/", b"TRP3_RPSpellbook_GameMaster/", b"TRP3_RPSpellbook_NPC/")
          base_platform, head_platform = base.partition("/")[0], head.partition("/")[0]
          same_repo = os.environ["HEAD_REPOSITORY"] == os.environ["GITHUB_REPOSITORY"]
          allowed = ()
          removed = ()
          if base_platform in platforms:
              automated = same_repo and base == f"{base_platform}/dev" and head == f"platform-sync/{base_platform}/from-main"
              if not automated and head_platform != base_platform:
                  raise SystemExit("Use the matching platform branch or the platform sync workflow.")
              allowed = addon_dirs
              if automated:
                  allowed += (b".github/workflows/", b".tools/ci/")
                  removed = tuple(platforms.values())
          elif base == "main":
              if head_platform in platforms:
                  raise SystemExit("Use the generated platform promotion PR to merge into main.")
              if head.startswith("platform-sync/"):
                  _, _, suffix = head.partition("/")
                  platform, _, direction = suffix.partition("/")
                  if not same_repo or platform not in platforms or direction != "to-main":
                      raise SystemExit("Invalid platform promotion branch.")
                  allowed = (platforms[platform],)
          if allowed:
              def changes(*options):
                  return set(subprocess.check_output([
                      "git", "diff", "--name-only", "--no-renames", "-z", *options,
                      os.environ["BASE_SHA"], "HEAD", "--",
                  ]).split(b"\0")) - {b""}

              deleted = changes("--diff-filter=D") if removed else set()
              for name in changes():
                  if not name.startswith(allowed) and not (name in deleted and name.startswith(removed)):
                      raise SystemExit("Pull request changes paths outside its platform scope.")
          PY

  addon-check:
    name: Addon check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare check tools
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 libxml2-utils

          tool_dir="$(mktemp -d "$RUNNER_TEMP/addon-check.XXXXXX")"
          archive="$tool_dir/actionlint.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" |
            sha256sum --check --strict

          tar -xzf "$archive" -C "$tool_dir" -- actionlint
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"

      - name: Test release builder
        shell: bash
        run: python3 -I -B -m unittest discover -s .tools/ci/tests -p 'test_*.py' -v

      - name: Check addon files and workflow
        shell: bash
        run: python3 -I -B .tools/ci/addon_check.py . "$BUILD_TARGET"

      - name: Verify release packages and notes
        shell: bash
        run: |
          set -euo pipefail
          for target in retail forever; do
            if [[ "$BUILD_TARGET" == both || "$BUILD_TARGET" == "$target" ]]; then
              python3 -I -B .tools/ci/build_release.py . "$RUNNER_TEMP/TRP3_Spellbook-$target.zip" --target "$target"
            fi
          done

  addon-tests:
    name: Addon tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1

          lua5.1 -v
          dpkg-query --show --showformat='${binary:Package} ${Version}\n' lua5.1

      - name: Run tests
        shell: bash
        run: python3 -I -B .tools/ci/run_tests.py "$BUILD_TARGET"
