name: Addon Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: addon-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify ZIP
        shell: bash
        run: python3 -I -B .tools/ci/build_release.py . "$RUNNER_TEMP/TRP3_Spellbook.zip"

      - name: Attach ZIP and license to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ZIP: ${{ runner.temp }}/TRP3_Spellbook.zip
        shell: bash
        run: |
          set -euo pipefail
          gh release upload --repo "$GITHUB_REPOSITORY" -- \
            "$RELEASE_TAG" "$RELEASE_ZIP" "$GITHUB_WORKSPACE/LICENSE"
